<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qnSweep" x1="14" y1="8" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="qnGlass" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="qnGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- glassy note body with a folded corner -->
  <path d="M14 12 H44 L50 18 V52 H14 Z"
        fill="url(#qnGlass)" stroke="url(#qnSweep)" stroke-width="2.4"
        stroke-linejoin="round" filter="url(#qnGlow)"/>
  <path d="M44 12 V18 H50 Z" fill="#38bdf8" fill-opacity="0.5"/>

  <!-- neon text lines -->
  <rect x="20" y="24" width="20" height="2.6" rx="1.3" fill="url(#qnSweep)" filter="url(#qnGlow)"/>
  <rect x="20" y="31" width="16" height="2.6" rx="1.3" fill="#5eead4" fill-opacity="0.85"/>

  <!-- a checked item -->
  <rect x="20" y="38" width="6" height="6" rx="1.6" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
  <path d="M21 41 L23 43 L26 39" stroke="#5eead4" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#qnGlow)"/>
  <rect x="30" y="40" width="10" height="2.4" rx="1.2" fill="#a78bfa" fill-opacity="0.8"/>
</svg>
