<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mkSweep" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="mkGlass" x1="14" y1="10" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="mkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- note hull: folded corner above, keel taper below -->
  <path d="M12 10H43L52 19V33C52 44 44 52 32 57C20 52 12 44 12 33Z"
        fill="url(#mkGlass)" stroke="url(#mkSweep)" stroke-width="2.6"
        stroke-linejoin="round" filter="url(#mkGlow)"/>
  <path d="M43 10V19H52Z" fill="#38bdf8" fill-opacity="0.5"/>

  <!-- neon note lines -->
  <rect x="19" y="22" width="21" height="2.8" rx="1.4" fill="url(#mkSweep)" filter="url(#mkGlow)"/>
  <rect x="19" y="28.5" width="14" height="2.8" rx="1.4" fill="#5eead4" fill-opacity="0.85"/>

  <!-- checked item -->
  <rect x="19" y="35" width="7" height="7" rx="1.8" fill="none" stroke="#a78bfa" stroke-width="1.9"/>
  <path d="M20.4 38.4L23 41L26.6 36.2" stroke="#5eead4" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#mkGlow)"/>
  <rect x="30" y="37.2" width="12" height="2.6" rx="1.3" fill="#a78bfa" fill-opacity="0.8"/>
</svg>
